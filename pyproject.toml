[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowgate-pilot"
version = "0.1.0"
description = "CPU-first feasibility pilot for permission-grounded selective LLM routing"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
flowgate-pilot = "flowgate.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

